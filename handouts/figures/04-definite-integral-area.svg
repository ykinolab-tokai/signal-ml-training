<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-labelledby="title description">
  <title id="title">定積分が表す面積</title>
  <desc id="description">区間 a から b で非負の関数 y = f(x) を描き，グラフと x 軸，直線 x = a，x = b で囲まれた部分を青く塗りつぶしている。この部分の面積 S が，a から b までの f(x) の定積分である。</desc>
  <rect width="760" height="400" fill="white"/>

  <!-- Same curve and interval as the Riemann-sum and trapezoidal-rule diagrams:
       y = 250 - (x - 200)^2 / 1000 in SVG coordinates, from x = 200 to 620. -->
  <path d="M 200 350 V 250 Q 410 250 620 73.6 V 350 Z"
        fill="#d6e9f8"/>
  <g stroke="#52738f" stroke-width="2" stroke-dasharray="7 5">
    <line x1="200" y1="350" x2="200" y2="250"/>
    <line x1="620" y1="350" x2="620" y2="73.6"/>
  </g>
  <path d="M 160 248.4 Q 400 267.6 640 56.4"
        fill="none" stroke="#23649b" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Coordinate axes and ticks at the integration limits. -->
  <g fill="none" stroke="#263238" stroke-width="2">
    <line x1="125" y1="370" x2="125" y2="45"/>
    <line x1="105" y1="350" x2="710" y2="350"/>
    <line x1="200" y1="350" x2="200" y2="358"/>
    <line x1="620" y1="350" x2="620" y2="358"/>
  </g>
  <path d="M 125 37 L 120 49 L 130 49 Z" fill="#263238"/>
  <path d="M 718 350 L 706 345 L 706 355 Z" fill="#263238"/>

  <g font-family="DejaVu Serif, serif" font-size="24" font-style="italic" fill="#263238">
    <text x="727" y="359">x</text>
    <text x="104" y="35">y</text>
    <text x="200" y="380" text-anchor="middle">a</text>
    <text x="620" y="380" text-anchor="middle">b</text>
    <text x="510" y="60" fill="#23649b">y = f(x)</text>
    <text x="410" y="290" text-anchor="middle" font-size="38" fill="#194e78">S</text>
  </g>
  <text x="107" y="379" font-family="DejaVu Serif, serif" font-size="21" fill="#263238">0</text>
</svg>
